name: Publish to Neocities

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Upload the site
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          cd out
          upload_args=()
          upload_file_count=0
          upload_batch() {
            if (( ${#upload_args[@]} == 0 )); then
              return
            fi
            curl --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 90 \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              -H "Authorization: Bearer ${NEOCITIES_API_KEY}" \
              "${upload_args[@]}" \
              https://neocities.org/api/upload
            upload_args=()
            upload_file_count=0
          }
          while IFS= read -r -d '' file; do
            upload_args+=( -F "${file#./}=@${file#./}" )
            ((upload_file_count+=1))
            if (( upload_file_count >= 5 )); then
              upload_batch
            fi
          done < <(find . -type f -print0)
          upload_batch
